{
  "name": "Direct Docker PATH sources",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "env": {
    "PATH": "/synthetic/workflow-bin:/usr/local/bin:/usr/bin:/bin"
  },
  "jobs": {
    "workflow-path": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "env": {
        "SIBLING": "false"
      },
