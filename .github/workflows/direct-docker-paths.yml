          "run": "echo PATH=/synthetic/github-env-bin:/usr/local/bin:/usr/bin:/bin >> \"$GITHUB_ENV\""
        },
        {
          "name": "file-path",
          "uses": "docker://python@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89",
          "env": {
            "HOME": "/synthetic/caller-home",
            "EXPECTED_PATH": "/synthetic/github-env-bin:/usr/local/bin:/usr/bin:/bin",
            "ALIAS_WS": "${{ github.workspace }}",
            "ALIAS_FILE": "${{ github.workspace }}/fixture.txt",
            "ALIAS_TEMP": "${{ runner.temp }}",
            "ALIAS_TEMP_FILE": "${{ runner.temp }}/proof.txt",
            "ORIGINAL_WORKSPACE": "prefix:${{ github.workspace }}",
            "EMBEDDED": "prefix:${{ github.workspace }}/fixture.txt",
            "NEAR_PREFIX": "${{ github.workspace }}-suffix"
          },
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "proof.py file-path",
            "directory": "${{ github.workspace }}",
            "file": "${{ github.workspace }}/fixture.txt",
            "temp": "${{ runner.temp }}",
            "temp_file": "${{ runner.temp }}/proof.txt",
            "MiXeD-Key": "two words",
            "empty": "",
            "whitespace": "   "
          }
        },
        {
          "name": "Verify parent file commands",
          "shell": "sh",
          "env": {
            "RESULT": "${{ steps.first.outputs.result }}"
          },
          "run": "set -eu\ntest \"$DIRECT_ENV\" = visible\ntest \"$RESULT\" = direct-proof\ntest \"$(command -v direct-tool)\" = \"$GITHUB_WORKSPACE/proof-bin/direct-tool\"\nprintf 'DIRECT_DOCKER_PARENT={\"outputs\":\"passed\",\"env\":\"passed\",\"path\":\"passed\"}\\n'\n"
        }
      ]
    }
  }
}
